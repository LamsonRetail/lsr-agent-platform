apiVersion: lsr/v1
agent:
  id: AG-KD-MATE-MADE
  name: LYLY — Trợ lý vận hành sàn MATE MADE
  version: 0.1.0
  owner: TODO@hapas.vn              # OWNER thật — auth dùng subscription của người này
  squad: KINH-DOANH
  is_squad_agent: true
  connect_mode: bot                 # bot | user
  description: >
    LYLY phục vụ team nội bộ MATE MADE gồm ba nhóm ADS · AFF · Vận hành sàn (thương hiệu
    túi và quà tặng có túi, bán B2C trên Shopee và TikTok Shop). Việc chính: trả lời câu
    hỏi về số vận hành (ROAS, tồn kho, tỷ lệ hoàn, hoa hồng affiliate) và chính sách sàn,
    luôn kèm trích dẫn nguồn và KỲ DỮ LIỆU. LYLY tra số để người ta quyết, KHÔNG quyết
    thay: không tự duyệt ngân sách quảng cáo, giá bán, khuyến mãi sàn, booking KOC hay
    đền bù ngoài chính sách. Team không có sale nên LYLY không soạn tin bán hàng và không
    tư vấn xử lý khách. Ngoài ra dựng biên bản họp từ recording, bóc riêng phần cam kết
    ai-làm-gì-khi-nào, chỉ publish khi chủ trì chốt. Số liệu nằm trong kho tri thức đã
    duyệt (sync từ Lark Base), KHÔNG nằm trong prompt.

lark:
  connect_mode: bot
  bot:
    app: custom                     # app Lark riêng của agent (cli_aaf6ca84c5389ed4)
    chat_ids: []                    # admin điền nhóm KD khi gán Ingress ở Console
    event_webhook: https://collector.lsr.internal/lark/events

runtime:
  sdk: claude-agent-sdk
  auth: subscription                # BẮT BUỘC: subscription của OWNER (claude setup-token).
                                    # KHÔNG dùng khoá LLM, KHÔNG dùng auth chung platform.
  model: claude-sonnet-5

prompt:                             # con trỏ version prompt — rollback = đổi con trỏ
  path: system_prompt.md
  version: 0.1.0
  ref: main

skills:
  - {name: brain-rag,  type: builtin}   # tri thức đã duyệt + trích dẫn nguồn
  - {name: lark-send,  type: builtin}   # gửi nháp biên bản / thông báo vào nhóm KD
  - {name: lark-docs,  type: builtin}   # publish biên bản đã chốt thành Lark Docs
  - {name: lark-task,  type: builtin}   # tạo task cho từng cam kết trong biên bản

telemetry:
  enabled: true                     # BẮT BUỘC (control point) — không gửi trace = không golive
  collector: https://collector.lsr.internal

tests:
  suite: tests/agent_tests.yaml

# Job đồng bộ dữ liệu KD → hàng chờ tri thức (kd_sync.py), chạy hàng ngày 6h VN.
# KHÔNG sync wiki space 7496094770155061279 — AG-LEGAL đã đồng bộ space đó.
schedule:
  - {name: kd-sync, cron: "0 6 * * *", command: "python3 kd_sync.py --once"}
