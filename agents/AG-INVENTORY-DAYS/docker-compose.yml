# Chạy bot ANN_KHHH 24/7 trên VM.  docker compose up -d --build
#
# Secret KHÔNG nằm trong file này — đọc từ .env cùng thư mục (đã .gitignore).
# Tối thiểu .env cần:
#   LARK_APP_ID_INVENTORY=cli_...
#   LARK_APP_SECRET_INVENTORY=...
services:
  ann-khhh:
    build: .
    container_name: ann-khhh
    environment:
      LARK_APP_ID_INVENTORY: ${LARK_APP_ID_INVENTORY:?thiếu app_id trong .env}
      LARK_APP_SECRET_INVENTORY: ${LARK_APP_SECRET_INVENTORY:?thiếu app_secret trong .env}
      LARK_DOMAIN: ${LARK_DOMAIN:-https://open.larksuite.com}

      # false = trả lời thật vào nhóm. Lần deploy đầu nên để true và xem log.
      DRY_RUN: ${DRY_RUN:-true}

      # Nhóm bot phục vụ, cách nhau bởi dấu phẩy. Để trống = MỌI nhóm bot được add.
      CHAT_IDS: ${CHAT_IDS:-oc_618134792f49a95d2f455314261c0215}

      # Bỏ trống = chỉ trả lời câu hỏi quy trình (Code of Conduct).
      EXCEL_PATH: ${EXCEL_PATH:-}

      ANSWER_ALL: ${ANSWER_ALL:-false}
      POLL_INTERVAL: ${POLL_INTERVAL:-3}

    restart: unless-stopped        # VM reboot -> bot tự lên lại
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
