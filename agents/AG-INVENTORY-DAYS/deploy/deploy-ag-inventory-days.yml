name: Deploy AG-INVENTORY-DAYS to VM

# Đưa bot KHHH (PLANNING' ASSISTANT) lên VM chạy 24/7.
#
# Vì sao tách file riêng, không sửa deploy.yml:
#   - deploy.yml lo stack platform (platform_api, collector, caddy, web...).
#     Agent hỏng thì không được kéo theo cả stack fail.
#   - Agent chạy container độc lập, không mở port, không đụng service nào.
#   - Team khác thêm agent sau này copy đúng file này là xong.
#
# Container: ann-khhh · ~80MB RAM · không mở port · chỉ gọi ra Lark.

on:
  push:
    branches: [main]
    paths:
      - "agents/AG-INVENTORY-DAYS/**"
      - ".github/workflows/deploy-ag-inventory-days.yml"
  workflow_dispatch:          # chạy tay từ nhánh bất kỳ (dùng khi test từ PLANNING)

concurrency:
  group: deploy-ag-inventory-days
  cancel-in-progress: false

env:
  AGENT_DIR: agents/AG-INVENTORY-DAYS
  REMOTE_DIR: /opt/lsr-agents/AG-INVENTORY-DAYS

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chặn sớm: thiếu secret thì fail ngay với thông báo rõ, thay vì để
      # container crash-loop im lặng trên VM rồi không ai biết.
      - name: Kiểm tra secret bắt buộc
        env:
          APP_ID: ${{ secrets.LARK_APP_ID_INVENTORY }}
          APP_SECRET: ${{ secrets.LARK_APP_SECRET_INVENTORY }}
        run: |
          missing=""
          [ -z "$APP_ID" ]     && missing="$missing LARK_APP_ID_INVENTORY"
          [ -z "$APP_SECRET" ] && missing="$missing LARK_APP_SECRET_INVENTORY"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu secret:$missing — thêm ở Settings > Secrets and variables > Actions"
            exit 1
          fi

      # Test tra cứu Code of Conduct chạy trước khi deploy. Tài liệu sai thì
      # dừng ở đây, không đẩy bản lỗi lên nhóm chat.
      - name: Test tra cứu Code of Conduct
        run: |
          pip install --quiet requests pyyaml python-dotenv openpyxl
          cd "$AGENT_DIR/src" && python ../tests/test_coc.py

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LSR_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.LSR_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync agent → VM (giữ nguyên .env trên VM)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}" \
            "mkdir -p $REMOTE_DIR"
          rsync -az --delete \
            --exclude='.env' --exclude='__pycache__' --exclude='bot_log.txt' \
            --exclude='push_log.txt' --exclude='bot.lock' --exclude='*.bat' --exclude='*.vbs' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            "$AGENT_DIR/" \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}:$REMOTE_DIR/"

      # .env ghi từ secret của GitHub — không ai phải gõ tay secret lên VM,
      # và secret không bao giờ nằm trong git.
      - name: Ghi .env trên VM từ secret
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}" \
            "umask 077 && cat > $REMOTE_DIR/.env" <<EOF
          LARK_APP_ID_INVENTORY=${{ secrets.LARK_APP_ID_INVENTORY }}
          LARK_APP_SECRET_INVENTORY=${{ secrets.LARK_APP_SECRET_INVENTORY }}
          LARK_DOMAIN=https://open.larksuite.com
          CHAT_IDS=
          USE_BASE=true
          REFRESH_MINUTES=15
          ANSWER_ALL=false
          POLL_INTERVAL=3
          DRY_RUN=${{ vars.AG_INVENTORY_DRY_RUN || 'true' }}
          EOF

      - name: docker compose up (build)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}" \
            "cd $REMOTE_DIR && sudo docker compose up -d --build && sudo docker compose ps"

      # Cổng chặn: container lên chưa đủ — phải thấy bot thật sự bắt đầu poll.
      # Sai app_secret thì container vẫn 'Up' nhưng crash-loop bên trong.
      - name: Verify bot đã chạy
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}" \
            "cd $REMOTE_DIR
             for i in \$(seq 1 12); do
               if sudo docker compose logs --tail 200 2>&1 | grep -q 'Bắt đầu poll'; then
                 echo '✓ Bot đang chạy:'
                 sudo docker compose logs --tail 20
                 exit 0
               fi
               sleep 5
             done
             echo '✗ Bot không khởi động được sau 60s:'
             sudo docker compose logs --tail 60
             exit 1"
