apiVersion: lsr/v1
agent:
  id: AG-HARRY
  name: Harry
  version: 0.1.0
  owner: hoalt@hapas.vn           # OWNER thật của agent — auth dùng subscription của người này
  squad: SQ-FA
  is_squad_agent: false
  connect_mode: bot        # bot | user
  description: >
    Trợ lý Dữ liệu & Họp chung cho squad Finance & Accounting (SQ-FA) của Lam
    Sơn Retail: tổng hợp tri thức/quy trình FA vào một nơi ai cũng tra được,
    tham gia các cuộc họp (nhận recording/nội dung trao đổi), tự soạn biên bản
    họp và lưu vào brain riêng của agent.

lark:
  connect_mode: bot
  bot:
    app: "Magic LSR"           # app riêng "Magic LSR" — admin cấu hình LARK_APP_ID/SECRET
                                # ở .env gốc trên server platform (KHÔNG nằm ở đây)
    chat_ids: []
    event_webhook: https://collector.lsr.internal/lark/events

runtime:
  sdk: claude-agent-sdk
  auth: subscription        # BẮT BUỘC: đăng nhập subscription của OWNER (claude login /
                            # setup-token). KHÔNG dùng api key, KHÔNG dùng auth chung platform.
  model: claude-sonnet-5

skills:                     # MCP tự do — chỉ khai báo + log
  - {name: resource-index, type: builtin}
  - {name: lark-task, type: mcp}

telemetry:
  enabled: true             # BẮT BUỘC (control point) — agent không gửi trace = không golive
  collector: https://collector.lsr.internal

tests:
  suite: tests/agent_tests.yaml
schedule: []
