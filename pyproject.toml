[project]
name = "rating-agent-lamsonretail"
version = "0.1.0"
description = "Agent nội bộ đánh giá nhân viên LamsonRetail (Lark + BigQuery)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "google-cloud-bigquery>=3.20",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
