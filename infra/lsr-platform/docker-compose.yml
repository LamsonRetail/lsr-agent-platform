name: lsr-platform

# Stack tối thiểu Giai đoạn 1: Postgres + LiteLLM Gateway + Collector.
# Ports bind 127.0.0.1 (VM dùng chung) — công khai qua Caddy/HTTPS sau.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lsr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lsr
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsr"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  collector:
    build: ./collector
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN}
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  minh_anh_bot:
    build: ./minh_anh_bot
    environment:
      MINH_ANH_LARK_APP_ID: ${MINH_ANH_LARK_APP_ID}
      MINH_ANH_LARK_APP_SECRET: ${MINH_ANH_LARK_APP_SECRET}
      LARK_DOMAIN_CONST: LARK        # LARK (LarkSuite) | FEISHU
      DRY_RUN: "true"                # true = chỉ log, không gửi tin/tạo task
      LSR_COLLECTOR: http://collector:8081
      LSR_TRANSCRIBE_URL: ${LSR_TRANSCRIBE_URL:-https://slashingly-unexistent-hue.ngrok-free.dev}
    restart: unless-stopped

  platform_api:
    build: ./platform_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      COLLECTOR_URL: http://collector:8081
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  caddy:
    build: ./caddy
    depends_on: [platform_api, collector]
    environment:
      LSR_GATEWAY_TOKEN: ${LSR_GATEWAY_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
