name: lsr-platform

# Stack tối thiểu Giai đoạn 1: Postgres + LiteLLM Gateway + Collector.
# Ports bind 127.0.0.1 (VM dùng chung) — công khai qua Caddy/HTTPS sau.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lsr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lsr
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsr"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  collector:
    build: ./collector
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN}
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  platform_api:
    build: ./platform_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      COLLECTOR_URL: http://collector:8081
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

volumes:
  pgdata:
