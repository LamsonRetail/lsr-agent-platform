name: lsr-platform

# Stack tối thiểu Giai đoạn 1: Postgres + LiteLLM Gateway + Collector.
# Ports bind 127.0.0.1 (VM dùng chung) — công khai qua Caddy/HTTPS sau.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lsr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lsr
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsr"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["optional"]   # tắt mặc định; bật khi cần: docker compose --profile optional up -d litellm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  collector:
    build: ./collector
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN}
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  # Cổng sự kiện hợp nhất (P1): long-connection Lark → /v1/ingest (dedupe+route+enqueue).
  event_gateway:
    build: ./event_gateway
    depends_on: [platform_api]
    environment:
      PLATFORM_URL: http://platform_api:8090
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}     # dùng làm ingest token nội bộ
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:-}
      MINH_ANH_LARK_APP_ID: ${MINH_ANH_LARK_APP_ID:-}
      MINH_ANH_LARK_APP_SECRET: ${MINH_ANH_LARK_APP_SECRET:-}
      LARK_DOMAIN_CONST: LARK
    restart: unless-stopped

  # Long-connection cho app Lark Sawadee HAPAS (squad Thái Lan — AG-SQ-THAILAND).
  # 1 container / 1 app: thiếu SAWADEE_LARK_APP_ID/SECRET trong .env thì container
  # chỉ idle (log cảnh báo), không ảnh hưởng gì — điền secret là tự chạy sau restart.
  event_gateway_sawadee:
    build: ./event_gateway
    depends_on: [platform_api]
    environment:
      PLATFORM_URL: http://platform_api:8090
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:-}
      LARK_APP_ID: ${SAWADEE_LARK_APP_ID:-}
      LARK_APP_SECRET: ${SAWADEE_LARK_APP_SECRET:-}
      LARK_DOMAIN_CONST: LARK
    restart: unless-stopped

  # Long-connection cho app Lark nihao-sourcing (team Sourcing — AG-SOURCING).
  event_gateway_sourcing:
    build: ./event_gateway
    depends_on: [platform_api]
    environment:
      PLATFORM_URL: http://platform_api:8090
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:-}
      LARK_APP_ID: ${SOURCING_LARK_APP_ID:-}
      LARK_APP_SECRET: ${SOURCING_LARK_APP_SECRET:-}
      LARK_DOMAIN_CONST: LARK
    restart: unless-stopped

  # Long-connection cho app Lark của Data Support (squad Data — AG-DATA-SUPPORT).
  event_gateway_data:
    build: ./event_gateway
    depends_on: [platform_api]
    environment:
      PLATFORM_URL: http://platform_api:8090
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:-}
      LARK_APP_ID: ${DATA_LARK_APP_ID:-}
      LARK_APP_SECRET: ${DATA_LARK_APP_SECRET:-}
      LARK_DOMAIN_CONST: LARK
    restart: unless-stopped

  # Bot admin Telegram: kênh AG-OPS/AG-EVAL ↔ admin (cảnh báo + nút duyệt việc).
  telegram_bot:
    build: ./telegram_bot
    depends_on: [platform_api]
    environment:
      PLATFORM_URL: http://platform_api:8090
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_LINK_CODE: ${TELEGRAM_LINK_CODE:-}
    restart: unless-stopped

  # P9: runtime cho agent NO-CODE — 1 service phục vụ mọi agent runtime='nocode'.
  nocode_runtime:
    build: ./nocode_runtime
    depends_on: [platform_api]
    environment:
      PLATFORM_URL: http://platform_api:8090
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:-}
      LLM_BASE_URL: ${NOCODE_LLM_BASE:-}
      LLM_API_KEY: ${NOCODE_LLM_KEY:-}
      NOCODE_DEFAULT_MODEL: ${NOCODE_DEFAULT_MODEL:-claude-sonnet-4-5}
    restart: unless-stopped

  # P7: platform agents — quan sát & ĐỀ XUẤT, người duyệt (HITL).
  ag_ops:
    build: ./platform_agents
    depends_on: [platform_api]
    environment:
      AGENT_SCRIPT: ops.py
      LSR_PLATFORM_URL: http://platform_api:8090
      LSR_AGENT_TOKEN: ${AG_OPS_TOKEN:-}
      OPS_INTERVAL_SECS: ${OPS_INTERVAL_SECS:-300}
    restart: unless-stopped

  ag_eval:
    build: ./platform_agents
    depends_on: [platform_api]
    environment:
      AGENT_SCRIPT: eval_agent.py
      LSR_PLATFORM_URL: http://platform_api:8090
      LSR_AGENT_TOKEN: ${AG_EVAL_TOKEN:-}
      EVAL_INTERVAL_SECS: ${EVAL_INTERVAL_SECS:-3600}
    restart: unless-stopped

  minh_anh_bot:
    build: ./minh_anh_bot
    depends_on: [platform_api]
    environment:
      # P1: minh_anh_bot là CONSUMER — lấy job từ platform, không tự nghe Lark nữa.
      LSR_PLATFORM_URL: http://platform_api:8090
      LSR_AGENT_ID: AG-MINH-ANH
      LSR_AGENT_TOKEN: ${MINH_ANH_AGENT_TOKEN:-}
      DRY_RUN: "true"                # true = chỉ log, không gửi tin/tạo task
      LSR_COLLECTOR: http://collector:8081
      LSR_TRANSCRIBE_URL: ${LSR_TRANSCRIBE_URL:-https://slashingly-unexistent-hue.ngrok-free.dev}
    restart: unless-stopped

  platform_api:
    build: ./platform_api
    depends_on:
      postgres:
        condition: service_healthy
      docker_proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      COLLECTOR_URL: http://collector:8081
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
      # Self-service enroll (thành viên tự đăng ký agent) — rỗng = tắt
      LSR_ENROLL_TOKEN: ${LSR_ENROLL_TOKEN:-}
      # Ingest token cho event_gateway (rỗng = dùng chung PLATFORM_ADMIN_TOKEN)
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN:-}
      LSR_COLLECTOR_PUBLIC: ${LSR_COLLECTOR_PUBLIC:-https://collector.34-126-154-135.sslip.io}
      LSR_APP_PUBLIC: ${LSR_APP_PUBLIC:-https://app.34-126-154-135.sslip.io}
      # Lark notify cho reviewer/agent owner (fallback creds Minh Anh nếu chưa có bot riêng)
      LARK_NOTIFY_APP_ID: ${LARK_NOTIFY_APP_ID:-}
      LARK_NOTIFY_APP_SECRET: ${LARK_NOTIFY_APP_SECRET:-}
      MINH_ANH_LARK_APP_ID: ${MINH_ANH_LARK_APP_ID:-}
      MINH_ANH_LARK_APP_SECRET: ${MINH_ANH_LARK_APP_SECRET:-}
      # App Lark phụ (theo routing_binding.app_id) — trả lời job bằng ĐÚNG bot đã nhận tin.
      # Secret chỉ nằm trong .env trên VM; thêm app mới = thêm cặp env + ghép vào JSON này.
      LARK_EXTRA_APPS: '{"${SAWADEE_LARK_APP_ID:-}": "${SAWADEE_LARK_APP_SECRET:-}",
                         "${SOURCING_LARK_APP_ID:-}": "${SOURCING_LARK_APP_SECRET:-}",
                         "${DATA_LARK_APP_ID:-}": "${DATA_LARK_APP_SECRET:-}"}'
      LARK_NOTIFY_CHAT_ID: ${LARK_NOTIFY_CHAT_ID:-}
      LARK_DOMAIN: ${LARK_DOMAIN:-https://open.larksuite.com}
      # P10: đăng nhập console qua Lark OAuth + kiểm tra ORG + quyền mặc định
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-https://app.34-126-154-135.sslip.io}
      ALLOWED_LOGIN_DOMAINS: ${ALLOWED_LOGIN_DOMAINS:-hapas.vn}
      LARK_TENANT_KEY: ${LARK_TENANT_KEY:-}
      DEFAULT_LOGIN_ROLE: ${DEFAULT_LOGIN_ROLE:-user}
      AGENT_RUNNER_IMAGE: ${AGENT_RUNNER_IMAGE:-lsr-agent-runner:latest}
      LSR_AGENT_NETWORK: ${LSR_AGENT_NETWORK:-lsr-platform_default}
      # Nơi chạy agent GĐ này = docker-socket-proxy trên VM chung (quyền hạn chế).
      # Tương lai: agent set runtime_host = daemon VM riêng → không đổi code.
      AGENT_DOCKER_HOST: ${AGENT_DOCKER_HOST:-tcp://docker_proxy:2375}
      # P2 Model Auth: thư mục secrets trên VM (host path) để mount ro vào agent_runner.
      SECRETS_HOST_DIR: ${SECRETS_HOST_DIR:-/opt/lsr-platform/secrets}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LSR_DEFAULT_FALLBACK_MODEL: ${LSR_DEFAULT_FALLBACK_MODEL:-claude-sonnet-4-5}
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  # Proxy socket Docker: platform_api chỉ được thao tác CONTAINER (tạo/stop/start),
  # KHÔNG toàn quyền root socket. Chỉ socket được mount vào ĐÂY (không vào API).
  docker_proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1        # xem/tạo container
      IMAGES: 1            # dùng image runner local
      NETWORKS: 1          # gắn network nội bộ
      POST: 1              # cho phép tạo/stop/start (mặc định read-only)
      EXEC: 0
      VOLUMES: 0
      INFO: 0
      AUTH: 0
      SWARM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  bq_sink:
    build: ./bq_sink
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lsr:${POSTGRES_PASSWORD}@postgres:5432/lsr
      BQ_PROJECT: ganesha-381907
      BQ_DATASET: AI_DB
      SINK_INTERVAL_SECONDS: "900"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/bq-sa.json
    volumes:
      - ./secrets/bq-sa.json:/secrets/bq-sa.json:ro
    restart: unless-stopped

  lsr_brain:
    build: ./lsr_brain          # runner consolidate hàng tuần (cuối tuần)
    depends_on: [platform_api]
    environment:
      LSR_PLATFORM_URL: http://platform_api:8090
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
      BRAIN_RUN_DOW: "6"        # 6 = Chủ nhật
      BRAIN_RUN_HOUR: "20"      # 20h giờ VN
    restart: unless-stopped

  web:
    build: ./web            # nguồn app Next.js (đồng bộ từ apps/platform-web)
    depends_on: [platform_api, collector]
    environment:
      LSR_PLATFORM_URL: http://platform_api:8090   # gọi nội bộ (bỏ qua Caddy/token)
      LSR_COLLECTOR: http://collector:8081
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
    restart: unless-stopped

  caddy:
    build: ./caddy
    depends_on: [platform_api, collector, web]
    environment:
      LSR_GATEWAY_TOKEN: ${LSR_GATEWAY_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
