# ============================================================
# Cấu hình chấm điểm — Rating Agent LamsonRetail
# Hai nhánh tách biệt: SQUAD (hiệu quả theo mục tiêu) và
# AGENT (skill / usage / kết quả + cổng test).
# Điểm chuẩn hoá thang 0-100. Trọng số không bắt buộc cộng bằng 1;
# scorer tự chuẩn hoá.
# ============================================================

# ---------------- SQUAD: hiệu quả theo mục tiêu ----------------
squad:
  weights:
    objective_achievement: 0.7   # mức đạt KR (actual/target)
    on_time_rate: 0.3            # đúng tiến độ
  # Trần điểm cho một KR (vượt chỉ tiêu vẫn tính tối đa 100 khi chấm)
  kr_progress_cap: 100
  grade_bands:
    - { min: 85, label: "A - Xuất sắc" }
    - { min: 70, label: "B - Tốt" }
    - { min: 55, label: "C - Đạt" }
    - { min: 0,  label: "D - Cần cải thiện" }

# ---------------- AGENT: skill / usage / kết quả ----------------
agent:
  weights:
    skill_score: 0.4     # tỉ lệ pass test theo skill
    result_score: 0.3    # chất lượng kết quả trả về
    usage_score: 0.3     # mức độ sử dụng
  # Thành phần của result_score
  result_components:
    success_rate: 0.5    # tỉ lệ trả về thành công (0-1)
    user_rating: 0.3     # điểm phản hồi người dùng (thang 1-5)
    latency: 0.2         # độ trễ (càng thấp càng tốt)
  grade_bands:
    - { min: 85, label: "A - Xuất sắc" }
    - { min: 70, label: "B - Tốt" }
    - { min: 55, label: "C - Đạt" }
    - { min: 0,  label: "D - Cần cải thiện" }

  # ---- Chính sách governance / auto-deactivate ----
  deactivate_policy:
    # mode: consecutive_fail | single_fail | pass_rate
    mode: consecutive_fail
    consecutive_fail_threshold: 2   # fail N lần liên tiếp -> deactivate
    pass_rate_threshold: 0.8        # dùng khi mode=pass_rate
    watch_pass_rate: 0.9            # dưới ngưỡng này -> cảnh báo "watch"
