name: Deploy backend to VM

# Tự deploy stack backend (docker compose) lên VM GCP khi push main.
# Chỉ đụng thư mục /opt/lsr-platform; KHÔNG ghi đè .env (secret) trên VM.
on:
  push:
    branches: [main]
    paths:
      - "infra/lsr-platform/**"
      - "apps/platform-web/**"
      - "scripts/lsr_adopt.py"
      - "scripts/lsr-onboard.sh"
      - "plugins/lsr-telemetry/**"
      - "installers/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LSR_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.LSR_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Chuẩn bị lib cho lsr_brain
        run: |
          mkdir -p infra/lsr-platform/lsr_brain/src
          cp -r src/rating_agent infra/lsr-platform/lsr_brain/src/

      - name: Chuẩn bị script bootstrap self-service (platform tự serve)
        run: |
          mkdir -p infra/lsr-platform/platform_api/bootstrap
          cp scripts/lsr_adopt.py infra/lsr-platform/platform_api/bootstrap/
          cp scripts/lsr_lark.py infra/lsr-platform/platform_api/bootstrap/
          cp plugins/lsr-telemetry/scripts/lsr_trace.py infra/lsr-platform/platform_api/bootstrap/
          cp scripts/lsr-onboard.sh infra/lsr-platform/platform_api/bootstrap/onboard.sh
          cp installers/lsr-install.command infra/lsr-platform/platform_api/bootstrap/
          cp installers/lsr-install.bat infra/lsr-platform/platform_api/bootstrap/
          ( cd plugins && zip -rq ../infra/lsr-platform/platform_api/bootstrap/lsr-telemetry-plugin.zip lsr-telemetry -x '*/__pycache__/*' )
          # Bake plugin vào image agent_runner (chạy agent trên VM)
          rm -rf infra/lsr-platform/agent_runner/plugin
          cp -r plugins/lsr-telemetry infra/lsr-platform/agent_runner/plugin

      - name: Chuẩn bị script vận hành cho VM (chạy trực tiếp trên máy chủ)
        run: |
          mkdir -p infra/lsr-platform/scripts
          cp scripts/add-model-credential.sh infra/lsr-platform/scripts/
          chmod +x infra/lsr-platform/scripts/*.sh

      - name: Rsync infra → VM (giữ nguyên .env, volume)
        run: |
          rsync -az \
            --exclude='.env' --exclude='secrets' --exclude='caddy_data' --exclude='caddy_config' --exclude='web' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            infra/lsr-platform/ \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}:/opt/lsr-platform/"

      - name: Rsync web app (Next.js) → VM
        run: |
          rsync -az --delete \
            --exclude='node_modules' --exclude='.next' --exclude='.env.local' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            apps/platform-web/ \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}:/opt/lsr-platform/web/"

      - name: docker compose up (build) + reload Caddy
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}" \
            'cd /opt/lsr-platform && sudo docker build -t lsr-agent-runner:latest ./agent_runner && sudo docker compose up -d --build && sleep 3 && sudo docker compose up -d && sudo docker compose restart caddy && sudo docker compose ps --format "table {{.Service}}\t{{.Status}}"'

      - name: Verify services (fail nếu API không lên)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.LSR_DEPLOY_USER }}@${{ secrets.LSR_DEPLOY_HOST }}" \
            'set -e
             for i in $(seq 1 12); do
               ok=1
               curl -sf -m 5 localhost:8090/health >/dev/null || ok=0
               curl -sf -m 5 localhost:8081/health >/dev/null || ok=0
               [ "$ok" = "1" ] && echo "✓ platform_api + collector healthy" && exit 0
               sleep 5
             done
             echo "✗ Service không healthy sau 60s"; cd /opt/lsr-platform; sudo docker compose ps; exit 1'
